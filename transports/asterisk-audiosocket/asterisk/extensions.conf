; Dialplan for the asterisk-audiosocket transport (sample).
; Needs res_audiosocket, func_curl and func_shell loaded.
;
; AudioSocket only transmits a UUID, so the caller id is stored first via a
; tiny HTTP side channel (AUDIOSOCKET_HTTP_PORT, default 9093) and the voice
; service matches it by UUID (AUDIOSOCKET_PORT, default 9092).

[from-trunk]
; OPTIONS keepalives to the account name (see the asterisk-ari sample for details)
exten => _[A-Za-z]!,1,Hangup()

exten => _X!,1,NoOp(Inbound to ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(VB_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,Set(VB_OK=${CURL(http://127.0.0.1:9093/call?uuid=${VB_UUID}&caller=${URIENCODE(${CALLERID(num)})}&did=${EXTEN})})
 same => n,AudioSocket(${VB_UUID},127.0.0.1:9092)
 same => n,Hangup()
