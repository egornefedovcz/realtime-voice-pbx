; Dialplan for the asterisk-ari transport (sample — adapt to your setup).
;
; Inbound calls go into the Stasis app "voicebot" (must equal ARI_APP) with
; arguments: <dialled number>,<caller id>[,noanswer]. Live transfers are rung
; in the background from [staff-ring]; the agent sets DIAL_TARGETS,
; FALLBACK_NUMBER and RING_TIMEOUT as channel variables.

[globals]
; Hard cap on concurrent outbound calls (toll-fraud protection).
MAX_OUTBOUND=4
; Caller id presented on outbound calls; empty = provider default.
OUT_CLI=

[hangup-log]
exten => s,1,NoOp(Hangup ${CHANNEL(name)} cause ${HANGUPCAUSE})
 same => n,Return()

[record]
; Optional call recording for tools/call-transcripts (MixMonitor, one WAV per call):
;   /var/spool/asterisk/monitor/YYYY/MM/DD/HHMMSS-<caller>-<uniqueid>.wav
; Tell callers the call is recorded (the example greeting does).
exten => s,1,MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${STRFTIME(${EPOCH},,%H%M%S)}-${CALLERID(num)}-${UNIQUEID}.wav,b)
 same => n,Return()

[from-trunk]
; Some providers send OPTIONS keepalives to the username of your registration
; Contact. Asterisk answers OPTIONS by checking that the extension EXISTS in the
; endpoint's context; without a match it returns 404, the provider marks you
; unreachable and stops sending calls even though registration says Registered.
; This pattern catches usernames (start with a letter); the dialplan itself is
; not executed for OPTIONS.
exten => _[A-Za-z]!,1,NoOp(OPTIONS keepalive to ${EXTEN} — if you see this executed, an INVITE hit the account name)
 same => n,Hangup()

exten => _X!,1,NoOp(Inbound to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(CHANNEL(hangup_handler_push)=hangup-log,s,1)
 same => n,Answer()
 same => n,GoSub(record,s,1)
 same => n,Stasis(voicebot,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

[test-inbound]
; Local test without a trunk:
;   asterisk -rx "channel originate Local/100@test-inbound extension 101@test-caller"
exten => _X!,1,NoOp(TEST call to ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(voicebot,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

[test-caller]
; Second leg of the test call: ~12 s of silence (greeting plays), then a stock
; prompt (exercises STT → reply → TTS), then silence for the agent's answer.
exten => 101,1,Answer()
 same => n,Playback(silence/10)
 same => n,Playback(silence/2)
 same => n,Playback(demo-congrats)
 same => n,Playback(silence/10)
 same => n,Playback(silence/10)
 same => n,Hangup()

[staff-ring]
; Background staff dial: ARI originates Local/s@staff-ring/n while the caller
; stays with the AI and hears music on hold. Whoever answers is bridged to the
; caller; if nobody does, the Local channel dies and the AI carries on.
;
; PJSIP/<ext> rings only the FIRST contact of an AOR. Softphones with push
; often register twice (push proxy + open app), so expand every PJSIP target
; to all its contacts. Contacts contain colons (sip:...) — do not use
; IF()/ExecIf() here, they treat the colon as a separator.
exten => s,1,NoOp(Staff ring: ${DIAL_TARGETS})
 same => n,Set(EPS=${DIAL_TARGETS})
 same => n,Set(T=)
 same => n(next),Set(D=${SHIFT(EPS,&)})
 same => n,GotoIf($["${D}" = ""]?done)
 same => n,GotoIf($["${D:0:6}" != "PJSIP/"]?add)
 same => n,Set(D=${PJSIP_DIAL_CONTACTS(${D:6})})
 same => n,GotoIf($["${D}" = ""]?next)
 same => n(add),GotoIf($["${T}" = ""]?first)
 same => n,Set(T=${T}&${D})
 same => n,Goto(next)
 same => n(first),Set(T=${D})
 same => n,Goto(next)
 same => n(done),GotoIf($["${T}" = ""]?fallback)
 same => n,Dial(${T},${RING_TIMEOUT})
 same => n,NoOp(Staff: ${DIALSTATUS})
 same => n,Hangup()
 same => n(fallback),GotoIf($["${FALLBACK_NUMBER}" = ""]?bye)
 same => n,Dial(Local/${FALLBACK_NUMBER}@outbound,60)
 same => n(bye),Hangup()

[internal]
; Staff SIP extensions, e.g.:
; exten => 201,1,Dial(PJSIP/staff201,30)

[from-staff]
; Outbound calls from staff softphones → [outbound] (fraud limits + OUT_CLI).
exten => _+X.,1,Goto(outbound,${EXTEN:1},1)
exten => _00X.,1,Goto(outbound,${EXTEN:2},1)
exten => _X.,1,Goto(outbound,${EXTEN},1)

[outbound]
; Toll-fraud protection: everything is denied by default. Allow ONLY the
; number patterns you need (international format without "+"), e.g.
; _1NXXNXXXXXX for NANP. Replace the pattern below.
exten => _1NXXNXXXXXX,1,NoOp(Outbound to ${EXTEN}, concurrent: ${GROUP_COUNT(out@outbound)})
 same => n,Set(GROUP(outbound)=out)
 same => n,GotoIf($[${GROUP_COUNT(out@outbound)} > ${MAX_OUTBOUND}]?cap)
 same => n,ExecIf($["${OUT_CLI}" != ""]?Set(CALLERID(num)=${OUT_CLI}))
 same => n,Dial(PJSIP/${EXTEN}@trunk,60)
 same => n,Hangup()
 same => n(cap),NoOp(FRAUD STOP: more than ${MAX_OUTBOUND} concurrent outbound calls)
 same => n,Hangup(21)
exten => _X.,1,NoOp(Outbound denied by dialplan: ${EXTEN})
 same => n,Hangup(21)
